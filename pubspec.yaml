name: zalando_clone_app
description: "Kardosi - A modern fashion e-commerce Flutter app with all modern features."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+5

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  country_picker: ^2.0.25
  smooth_page_indicator: ^1.1.0
  # carousel_slider: ^4.1.1
  photo_view: ^0.14.0
  image_picker: ^1.0.7
  flutter_screenutil: ^5.9.0
  animated_toggle_switch: ^0.8.5
  u_credit_card: ^1.4.0
  # card_scanner: ^1.0.2
  local_auth: ^2.3.0

  # State Management
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.7
  stream_transform: ^2.0.0

  # Navigation
  go_router: ^12.1.3

  # Local Storage & Database
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path: ^1.9.0

  # Network & API
  dio: ^5.4.1
  http: ^1.2.0
  connectivity_plus: ^5.0.2

  # Authentication & Security
  flutter_secure_storage: ^9.0.0

  # Notifications
  # flutter_local_notifications: ^16.3.2
  permission_handler: ^11.3.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  open_file: ^3.5.10
  webview_flutter: ^4.4.2
  share_plus: ^7.2.2
  cross_file: ^0.3.4
  device_info_plus: ^9.1.2
  package_info_plus: ^9.0.0
  flutter_svg: ^2.0.9
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  flutter_rating_bar: ^4.0.1
  flutter_slidable: ^3.0.1
  flutter_animate: ^4.5.0
  loading_animation_widget: ^1.3.0
  custom_refresh_indicator: ^4.0.1
  provider: ^6.1.5+1
  google_sign_in: ^6.2.1
  flutter_html: ^3.0.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.5

# Resolve conflict: hive_generator ^2.0.1 needs analyzer <7, while
# flutter_test/bloc_test pull in test_api 0.7.9. Pinning analyzer allows resolution.
dependency_overrides:
  analyzer: ">=4.6.0 <7.0.0"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/play_store_512.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/play_store_512.png

flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.
  # Steps to make this work:
  # 1. Customize the parameters below.
  # 2. run the following command in the terminal:
  # dart run flutter_native_splash:create
  # 3. voila, done!

  # Color for splash screen background (white to match the logo background)
  color: "#FFFFFF"
  
  # Image to display on splash screen (centered)
  image: assets/images/play_store_512.png
  
  # Platform-specific settings
  android: true
  ios: true
  web: true
  
  # Full screen mode (hides notification bar on Android)
  fullscreen: true
  
  # Image alignment
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Localization configuration
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - shorebird.yaml
    - assets/images/
    - assets/images/brands/
    - assets/icons/
    - assets/animations/
    - assets/data/
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
